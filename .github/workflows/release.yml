name: Release

# Release automation (single-branch / trunk model on master).
#
# Every PR merged into master releases at once, with no approval. A run releases
# everything merged since the latest tag, with the strongest release label among
# those PRs (release:major > release:minor > release:patch; release:skip or no
# label adds nothing). Runs go one at a time (concurrency group): a run that
# waited behind another and finds nothing new since the latest tag stops there.
# A pending run replaced by a newer one loses nothing: the newer one picks up
# its PR too.
#
# A manual fallback is available via workflow_dispatch (bump forced).
on:
  pull_request:
    types: [closed]
    branches:
      - master
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump to apply'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    # On PR events, only run for actually-merged PRs.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout master
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      # The PRs behind master's commits since the latest tag (merge or squash
      # commits: the first-parent line), and the strongest bump their labels ask.
      - name: Decide the bump
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCED: ${{ inputs.bump }}
        run: |
          LATEST=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          echo "latest=${LATEST}" >> "$GITHUB_OUTPUT"
          if [ -n "${FORCED}" ]; then
            BUMP="${FORCED}"
            echo "Manual dispatch → ${BUMP}"
          else
            LABELS=$(git log --first-parent --format=%H "${LATEST:+${LATEST}..}HEAD" | while read -r SHA; do
              gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/pulls" \
                --jq '.[] | select(.merged_at != null) | .labels[].name'
            done | sort -u)
            BUMP=""
            for B in patch minor major; do
              if echo "${LABELS}" | grep -qx "release:${B}"; then BUMP="${B}"; fi
            done
            echo "Labels since ${LATEST:-the first commit}: $(echo "${LABELS}" | tr '\n' ' ')→ ${BUMP:-nothing to release}"
          fi
          echo "bump=${BUMP}" >> "$GITHUB_OUTPUT"
          if [ -z "${BUMP}" ]; then
            echo "### Nothing to release since ${LATEST:-the first commit}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup Node
        if: steps.decide.outputs.bump != ''
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Configure git
        if: steps.decide.outputs.bump != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        if: steps.decide.outputs.bump != ''
        run: npm ci

      # Source of truth for the released version is the latest git tag.
      # Fall back to package.json the very first time (no tag yet).
      - name: Bump version (${{ steps.decide.outputs.bump }})
        if: steps.decide.outputs.bump != ''
        id: bump
        env:
          LATEST: ${{ steps.decide.outputs.latest }}
          BUMP: ${{ steps.decide.outputs.bump }}
        run: |
          if [ -z "${LATEST}" ]; then
            CURRENT=$(node -p "require('./package.json').version")
          else
            CURRENT="${LATEST#v}"
          fi
          npm pkg set version="${CURRENT}"
          NEW_VERSION=$(npm version "${BUMP}" --no-git-tag-version)
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Base ${CURRENT} → ${NEW_VERSION}"

      - name: Build
        if: steps.decide.outputs.bump != ''
        run: npm run build

      # Publish first: the next bump is computed from the latest tag, so a tag
      # pushed before a failed publish would skip a version that never shipped.
      - name: Publish to npm
        if: steps.decide.outputs.bump != ''
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}

      # Tags are not subject to branch protection, so GITHUB_TOKEN is enough.
      # The version bump is intentionally NOT committed back to the protected
      # master branch; the tag + the published npm package carry the version.
      - name: Tag release
        if: steps.decide.outputs.bump != ''
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin "${VERSION}"

      - name: Create GitHub Release
        if: steps.decide.outputs.bump != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          gh release create "${VERSION}" \
            --title "${VERSION}" \
            --generate-notes \
            --target "$(git rev-parse HEAD)"

      - name: Job summary
        if: steps.decide.outputs.bump != ''
        run: |
          {
            echo "### Released ${{ steps.bump.outputs.version }} :rocket:"
            echo "- npm: published"
            echo "- GitHub Release: created"
          } >> "$GITHUB_STEP_SUMMARY"
