version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # No runtime dependency: every npm bump is a dev tool, and merging releases.
    # Label a bump that changes the published package by hand.
    labels:
      - dependencies
      - 'release:skip'
    # typescript-eslint pins its TypeScript peer range: a TypeScript major
    # breaks `npm ci` until typescript-eslint supports it. Bump both by hand.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    labels:
      - dependencies
      - 'release:skip'
