<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Air Hockey</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f6f8;
        --fg: #14202b;
        --muted: #5b6875;
        --field: #fff;
        --line: #c9d2da;
        --accent: #0d6efd;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e151c;
          --fg: #e6edf3;
          --muted: #8b98a5;
          --field: #18222c;
          --line: #2c3a47;
          --accent: #4d94ff;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      /* The whole window: a one-line header, then the game as large as its box allows. */
      main {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 12px 16px 16px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 40px;
      }
      h1 {
        margin: 0;
        font-size: 22px;
        white-space: nowrap;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      #status {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #leave {
        margin-left: auto;
      }
      /* Takes the height left under the header; the canvas is W × CH field units (2000 × 1500
         with its HUD bands), so the game is as wide as that box, or as its height allows. */
      #play {
        flex: 1 1 0;
        min-height: 0;
        container-type: size;
        display: grid;
        place-items: center;
      }
      #game {
        width: min(100cqw, 100cqh * 2000 / 1500);
      }
      form {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: end;
      }
      label {
        display: grid;
        gap: 4px;
        font-size: 14px;
        color: var(--muted);
        flex: 1 1 200px;
      }
      input,
      select,
      button {
        font: inherit;
        min-height: 40px;
        padding: 6px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--field);
        color: var(--fg);
        min-width: 0;
      }
      button {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        font-weight: 600;
        padding: 6px 20px;
        cursor: pointer;
      }
      [hidden] {
        display: none !important;
      }
      /* A phone on its side, in a game: the game gets the whole screen. */
      @media (orientation: landscape) and (max-height: 500px) {
        .playing main {
          padding: 0;
          gap: 0;
        }
        .playing header {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Air Hockey</h1>
        <p id="status" hidden></p>
        <button id="leave" type="button" hidden>Leave</button>
      </header>
      <p id="intro">Open this page in another tab to play together.</p>
      <form id="form">
        <label>Name <input name="name" maxlength="16" required autocomplete="nickname" /></label>
        <label
          >Mode
          <select name="mode">
            <option value="local">Local (tabs of this browser)</option>
            <option value="server">Server</option>
          </select>
        </label>
        <label id="url" hidden
          >Server URL <input name="url" type="url" value="ws://localhost:8787/demo"
        /></label>
        <button>Join</button>
      </form>
      <div id="play" hidden><div id="game"></div></div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
