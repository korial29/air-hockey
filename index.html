<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Air Hockey</title>
    <style>:root{--lightningcss-light:initial;--lightningcss-dark: ;color-scheme:light dark;--bg:#f4f6f8;--fg:#14202b;--muted:#5b6875;--field:#fff;--line:#c9d2da;--accent:#0d6efd}@media (prefers-color-scheme:dark){:root{--lightningcss-light: ;--lightningcss-dark:initial;--bg:#0e151c;--fg:#e6edf3;--muted:#8b98a5;--field:#18222c;--line:#2c3a47;--accent:#4d94ff}}*{box-sizing:border-box}body{background:var(--bg);color:var(--fg);margin:0;font:16px/1.5 system-ui,sans-serif}main{flex-direction:column;gap:12px;min-height:100dvh;padding:12px 16px 16px;display:flex}header{align-items:center;gap:12px;min-height:40px;display:flex}h1{white-space:nowrap;margin:0;font-size:22px}p{color:var(--muted);margin:0}#status{text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;overflow:hidden}#leave{margin-left:auto}#play{flex:1 1 0;place-items:center;min-height:0;display:grid;container-type:size}#game{width:min(100cqw,133.333cqh)}form{flex-wrap:wrap;align-items:end;gap:12px;display:flex}label{color:var(--muted);flex:200px;gap:4px;font-size:14px;display:grid}input,select,button{font:inherit;border:1px solid var(--line);background:var(--field);min-height:40px;color:var(--fg);border-radius:8px;min-width:0;padding:6px 10px}button{background:var(--accent);border-color:var(--accent);color:#fff;cursor:pointer;padding:6px 20px;font-weight:600}[hidden]{display:none!important}</style>
    <script type="module" crossorigin src="/air-hockey/assets/index-Bjd7f-tp.js"></script>
  </head>
  <body>
    <main>
      <header>
        <h1>Air Hockey</h1>
        <p id="status" hidden></p>
        <button id="leave" type="button" hidden>Leave</button>
      </header>
      <p id="intro">Open this page in another tab to play together.</p>
      <form id="form">
        <label>Name <input name="name" maxlength="16" required autocomplete="nickname" /></label>
        <label
          >Mode
          <select name="mode">
            <option value="local">Local (tabs of this browser)</option>
            <option value="server">Server</option>
          </select>
        </label>
        <label id="url" hidden
          >Server URL <input name="url" type="url" value="ws://localhost:8787/demo"
        /></label>
        <button>Join</button>
      </form>
      <div id="play" hidden><div id="game"></div></div>
    </main>
  </body>
</html>
